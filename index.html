<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Llenado de Formatos Oficiales</title>
    <style>
        body { background: #e0e0e0; font-family: sans-serif; margin: 0; }
        
        /* Contenedor de la hoja */
        .page {
            width: 215.9mm; /* Ancho Carta */
            height: 279.4mm; /* Alto Carta */
            margin: 20px auto;
            background-color: white;
            background-size: contain;
            background-repeat: no-repeat;
            position: relative; /* Importante para posicionar campos */
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
        }

        /* Imagen de fondo de la hoja */
        #page1 { background-image: url('hoja1.jpg'); }
        #page2 { background-image: url('hoja2.jpg'); }

        /* Estilo de los campos de entrada */
        .campo {
            position: absolute;
            border: 1px solid rgba(0,0,255,0.2); /* Borde azul suave para ver dónde escribes */
            background: transparent;
            font-size: 14px;
            font-weight: bold;
            color: #003366;
            outline: none;
        }
        
        /* Ocultar bordes al imprimir */
        @media print {
            body { background: white; }
            .page { margin: 0; box-shadow: none; page-break-after: always; }
            .campo { border: none; }
            #btn-imprimir { display: none; }
        }

        #btn-imprimir {
            position: fixed; top: 20px; right: 20px;
            padding: 15px; background: #1a5c37; color: white;
            border: none; border-radius: 5px; cursor: pointer; z-index: 100;
        }

        /* EJEMPLOS DE POSICIONAMIENTO (Ajustar según tu imagen) */
        .f-ooad { top: 98px; left: 100px; width: 300px; }
        .f-folio { top: 125px; left: 680px; width: 100px; }
        .f-nombre { top: 215px; left: 80px; width: 500px; }
        .f-matricula { top: 245px; left: 80px; width: 150px; }
    </style>
</head>
<body>

<button id="btn-imprimir" onclick="window.print()">IMPRIMIR FORMATO</button>

<div class="page" id="page1">
    <input type="text" class="campo f-ooad" placeholder="OOAD">
    <input type="text" class="campo f-folio" placeholder="0001">
    <input type="text" class="campo f-nombre" placeholder="Nombre del trabajador">
    <input type="text" class="campo f-matricula" placeholder="Matrícula">
</div>

<div class="page" id="page2">
    <input type="text" class="campo" style="top: 150px; left: 100px; width: 400px;" placeholder="Dato Hoja 2">
</div>

</body>
</html>
